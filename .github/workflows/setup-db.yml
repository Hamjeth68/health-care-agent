name: Setup Supabase Database

# Run once manually after adding SUPABASE_ACCESS_TOKEN to GitHub Secrets.
# Get your personal access token at: https://supabase.com/dashboard/account/tokens
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request

          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          with open("supabase/migrations/20260714000000_create_core_tables.sql") as f:
              sql = f.read()

          payload = json.dumps({"query": sql}).encode()
          req = urllib.request.Request(
              "https://api.supabase.com/v1/projects/njgzkxvftoccdckcivaj/database/query",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  body = resp.read().decode()
                  print(f"HTTP {resp.status}: {body}")
                  print("Migration applied successfully.")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"HTTP {e.code}: {body}", file=sys.stderr)
              sys.exit(1)
          PYEOF
